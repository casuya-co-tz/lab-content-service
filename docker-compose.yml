version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab_content
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-EXEC", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3100:3100"
    environment:
      PORT: 3100
      HOST: "0.0.0.0"
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: lab_content
      API_KEY: ${API_KEY:-lab-content-secret-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CASUYA_ORIGIN: ${CASUYA_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    command: node src/migrate.js
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: lab_content
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    command: node src/seed-templates.js
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: lab_content
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
