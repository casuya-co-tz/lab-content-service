services:
  - type: web
    name: lab-content-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: HOST
        value: 0.0.0.0
      - key: PGHOST
        fromDatabase:
          name: lab-content-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: lab-content-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: lab-content-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: lab-content-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: lab-content-db
          property: database
      - key: CASUYA_ORIGIN
        value: https://casuya-virtual-lab-platform.vercel.app
      - key: API_KEY
        value: e5b6150048a682e3b9148389341b3afb69e2a67f0dd1becc7c943472a01d328f
      - key: ADMIN_PASSWORD
        value: lab-admin-2026
      - key: PGSSLMODE
        value: require

databases:
  - name: lab-content-db
    plan: free
    databaseName: lab_content
    user: lab_content_user
