<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ohm's Law Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 16px; color: #a78bfa; }
    .layout { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px; }
    .circuit { flex: 1; min-width: 300px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; text-align: center; }
    .circuit svg { width: 100%; max-width: 350px; }
    .controls { flex: 1; min-width: 250px; }
    .control-group { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .control-group label { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .control-group .value { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .control-group input[type=range] { width: 100%; }
    .readings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .reading { background: #0f172a; border-radius: 4px; padding: 12px; text-align: center; }
    .reading .label { font-size: 10px; color: #64748b; text-transform: uppercase; }
    .reading .val { font-size: 20px; font-weight: 700; }
    .power-color { color: #f59e0b; }
    .current-color { color: #34d399; }
    .resistance-color { color: #f472b6; }
    .voltage-color { color: #60a5fa; }
    button { width: 100%; padding: 10px; background: #7c3aed; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <h1>Ohm's Law: V = IR</h1>
  <div class="layout">
    <div class="circuit">
      <svg viewBox="0 0 350 200">
        <rect x="20" y="60" width="310" height="80" fill="none" stroke="#475569" stroke-width="2" rx="4"/>
        <text x="175" y="30" fill="#94a3b8" text-anchor="middle" font-size="12">Circuit</text>
        <circle cx="60" cy="100" r="20" fill="none" stroke="#60a5fa" stroke-width="2"/>
        <text x="60" y="104" fill="#60a5fa" text-anchor="middle" font-size="10" id="v-label">V</text>
        <line x1="100" y1="100" x2="150" y2="100" stroke="#475569" stroke-width="2"/>
        <rect x="150" y="85" width="50" height="30" fill="none" stroke="#f472b6" stroke-width="2" rx="2"/>
        <text x="175" y="104" fill="#f472b6" text-anchor="middle" font-size="10" id="r-label">R</text>
        <line x1="200" y1="100" x2="290" y2="100" stroke="#475569" stroke-width="2"/>
        <circle cx="290" cy="100" r="12" fill="none" stroke="#34d399" stroke-width="2"/>
        <text x="290" y="104" fill="#34d399" text-anchor="middle" font-size="8">A</text>
        <line x1="290" y1="88" x2="290" y2="60" stroke="#475569" stroke-width="2"/>
        <line x1="290" y1="60" x2="60" y2="60" stroke="#475569" stroke-width="2"/>
        <line x1="60" y1="60" x2="60" y2="80" stroke="#475569" stroke-width="2"/>
        <line x1="290" y1="112" x2="290" y2="140" stroke="#475569" stroke-width="2"/>
        <line x1="290" y1="140" x2="60" y2="140" stroke="#475569" stroke-width="2"/>
        <line x1="60" y1="140" x2="60" y2="120" stroke="#475569" stroke-width="2"/>
      </svg>
    </div>
    <div class="controls">
      <div class="control-group">
        <label>Voltage (V)</label>
        <div class="value voltage-color" id="v-display">12.0 V</div>
        <input type="range" id="voltage" min="1" max="24" step="0.1" value="12">
      </div>
      <div class="control-group">
        <label>Resistance (ohms)</label>
        <div class="value resistance-color" id="r-display">100 ohm</div>
        <input type="range" id="resistance" min="10" max="1000" step="1" value="100">
      </div>
      <div class="readings">
        <div class="reading"><div class="label">Current (I)</div><div class="val current-color" id="i-val">0.12 A</div></div>
        <div class="reading"><div class="label">Power (P)</div><div class="val power-color" id="p-val">1.44 W</div></div>
      </div>
      <button onclick="document.getElementById('voltage').value=12;document.getElementById('resistance').value=100;update()">Reset</button>
    </div>
  </div>
  <script>
    var vSlider = document.getElementById("voltage");
    var rSlider = document.getElementById("resistance");
    vSlider.addEventListener("input", update);
    rSlider.addEventListener("input", update);
    function update() {
      var V = parseFloat(vSlider.value);
      var R = parseFloat(rSlider.value);
      var I = V / R;
      var P = V * I;
      document.getElementById("v-display").textContent = V.toFixed(1) + " V";
      document.getElementById("r-display").textContent = R + " ohm";
      document.getElementById("i-val").textContent = I.toFixed(3) + " A";
      document.getElementById("p-val").textContent = P.toFixed(2) + " W";
    }
    update();
  </script>
</body>
</html>
