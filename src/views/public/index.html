<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Content Service — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f9f3e9;
      --panel: #ffffff;
      --panel2: #f5f0e8;
      --border: #e0d8cc;
      --text: #191919;
      --dim: #6b6b6b;
      --accent: #34e8bb;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #a95af8;
      --cyan: #06b6d4;
    }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); position: relative; }
    .topbar h1 { font-size: clamp(13px, 3.5vw, 16px); font-weight: 600; letter-spacing: 0.3px; white-space: nowrap; color: var(--dim); }
    .topbar h1 span { color: #0b100f; font-weight: 700; }
    .hamburger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 20px; height: 2px; background: var(--dim); transition: 0.2s; }
    .topbar nav { display: flex; gap: 2px; align-items: center; }
    .topbar nav a { padding: 6px 12px; font-size: clamp(11px, 2.5vw, 13px); font-weight: 500; color: var(--dim); text-decoration: none; transition: 0.15s; white-space: nowrap; }
    .topbar nav a:hover { color: var(--text); background: var(--panel2); }
    .topbar nav a.active { color: #003326; background: rgba(52,232,187,0.12); }

    @media (max-width: 640px) {
      .hamburger { display: flex; }
      .topbar nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; background: var(--panel); border-bottom: 1px solid var(--border); padding: 8px; z-index: 100; gap: 2px; }
      .topbar nav.open { display: flex; }
      .topbar nav a { width: 100%; padding: 10px 12px; }
    }

    .content { padding: clamp(12px, 3vw, 24px); max-width: 1200px; margin: 0 auto; }

    .btn { height: 30px; padding: 0 12px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: clamp(11px, 2.5vw, 12px); font-weight: 500; cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; touch-action: manipulation; }
    .btn:hover { background: var(--border); }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #003326; font-weight: 600; }
    .btn.primary:hover { background: #2dd4bf; }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.green:hover { background: #16a34a; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 1px; margin-bottom: clamp(16px, 4vw, 24px); background: var(--border); }
    .stat-card { background: var(--panel); padding: clamp(12px, 2.5vw, 16px); }
    .stat-card + .stat-card { border-left: none; }
    .stat-card .label { font-size: clamp(9px, 2vw, 11px); text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); font-weight: 600; }
    .stat-card .value { font-size: clamp(22px, 6vw, 30px); font-weight: 700; margin-top: 4px; }
    .stat-card .sub { font-size: clamp(10px, 2vw, 12px); color: var(--dim); margin-top: 2px; }
    .stat-card.blue .value { color: var(--accent); }
    .stat-card.green .value { color: var(--green); }
    .stat-card.amber .value { color: var(--amber); }
    .stat-card.purple .value { color: var(--purple); }
    .stat-card.cyan .value { color: var(--cyan); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-bottom: clamp(16px, 4vw, 24px); background: var(--border); }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel { background: var(--panel); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: clamp(8px, 2vw, 12px) clamp(12px, 2.5vw, 16px); border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
    .panel-header h2 { font-size: clamp(11px, 2.5vw, 13px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--dim); }
    .panel-body { padding: clamp(12px, 2.5vw, 16px); }

    .subject-bar { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .subject-bar:last-child { border-bottom: none; }
    .subject-bar .name { font-size: clamp(12px, 2.5vw, 14px); font-weight: 500; width: clamp(80px, 20vw, 120px); flex-shrink: 0; }
    .subject-bar .bar-wrap { flex: 1; height: 8px; background: var(--panel2); overflow: hidden; min-width: 40px; }
    .subject-bar .bar { height: 100%; transition: width 0.5s; }
    .subject-bar .count { font-size: clamp(11px, 2vw, 13px); color: var(--dim); width: 36px; text-align: right; flex-shrink: 0; }

    .activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot { width: 8px; height: 8px; margin-top: 5px; flex-shrink: 0; }
    .activity-dot.create { background: var(--green); }
    .activity-dot.update { background: var(--accent); }
    .activity-dot.delete { background: var(--red); }
    .activity-dot.publish { background: var(--purple); }
    .activity-dot.version { background: var(--amber); }
    .activity-text { font-size: clamp(11px, 2.5vw, 13px); flex: 1; min-width: 0; }
    .activity-text strong { color: var(--text); }
    .activity-time { font-size: clamp(10px, 2vw, 11px); color: var(--dim); white-space: nowrap; flex-shrink: 0; }

    .lab-row { display: flex; align-items: center; gap: clamp(6px, 2vw, 12px); padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .lab-row:last-child { border-bottom: none; }
    .lab-row .title { font-size: clamp(12px, 2.5vw, 14px); font-weight: 500; flex: 1; min-width: 0; word-break: break-word; }
    .lab-row .version { font-size: clamp(10px, 2vw, 12px); color: var(--dim); }
    .lab-row .status { font-size: clamp(9px, 2vw, 11px); font-weight: 600; padding: 2px 8px; }
    .lab-row .status.pub { color: var(--green); background: rgba(34,197,94,0.1); }
    .lab-row .status.draft { color: var(--amber); background: rgba(245,158,11,0.1); }

    .search-box { display: flex; gap: 1px; margin-bottom: 16px; }
    .search-box input { flex: 1; min-width: 0; height: clamp(34px, 8vw, 40px); padding: 0 12px; background: var(--panel); border: 1px solid var(--border); color: var(--text); font-size: clamp(13px, 3vw, 15px); outline: none; }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(52,232,187,0.2); z-index: 1; position: relative; }
    .search-box input::placeholder { color: #b0a898; }

    .empty { text-align: center; padding: 32px 16px; color: var(--dim); font-size: clamp(12px, 2.5vw, 14px); }

    .sc { font-size: clamp(9px, 2vw, 11px); padding: 2px 6px; font-weight: 500; text-transform: uppercase; display: inline-block; }
    .sc.chemistry { color: #f87171; background: rgba(248,113,113,0.1); }
    .sc.physics { color: #60a5fa; background: rgba(96,165,250,0.1); }
    .sc.biology { color: #34d399; background: rgba(52,211,153,0.1); }
    .sc.mathematics { color: #fbbf24; background: rgba(251,191,36,0.1); }

    .templates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: 1px; background: var(--border); }
    .template-card { padding: clamp(10px, 2vw, 14px); background: var(--panel2); cursor: pointer; transition: 0.15s; }
    .template-card:hover { background: var(--border); }
    .template-card:active { transform: scale(0.98); }
    .template-card .t-name { font-size: clamp(11px, 2.5vw, 13px); font-weight: 600; margin-bottom: 4px; }
    .template-card .t-desc { font-size: clamp(10px, 2vw, 11px); color: var(--dim); line-height: 1.4; margin-bottom: 6px; }
    .template-card .t-meta { font-size: clamp(10px, 2vw, 11px); color: var(--dim); }

    code { font-size: 0.9em; padding: 1px 5px; background: var(--panel2); color: var(--text); }
    a { color: #003326; text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: #34e8bb; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1><span>Lab Content</span> Service</h1>
    <button class="hamburger" id="hamburger" aria-label="Menu" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
    <nav id="topnav">
      <a href="/" class="active">Dashboard</a>
      <a href="/editor">Editor</a>
      <a href="/api/health" target="_blank">Health</a>
      <a href="/api/openapi.json" target="_blank">API</a>
    </nav>
  </div>

  <div class="content">
    <div class="stats-grid" id="stats-grid"></div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search labs by title, description, subject..." onkeydown="if(event.key==='Enter')searchLabs()">
      <button class="btn primary" onclick="searchLabs()">Search</button>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">
          <h2>Labs by Subject</h2>
        </div>
        <div class="panel-body" id="subjects-chart"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Recent Activity</h2>
        </div>
        <div class="panel-body" id="activity-list"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">
          <h2>All Labs</h2>
          <button class="btn" onclick="loadLabs()">Refresh</button>
        </div>
        <div class="panel-body" id="labs-list"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Templates</h2>
        </div>
        <div class="panel-body" id="templates-list"></div>
      </div>
    </div>

    <div id="search-results" style="display:none">
      <div class="panel" style="margin-bottom:24px">
        <div class="panel-header">
          <h2>Search Results</h2>
          <button class="btn" onclick="closeSearch()">Close</button>
        </div>
        <div class="panel-body" id="search-results-body"></div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = new URLSearchParams(window.location.search).get('api_key') || localStorage.getItem('api_key') || 'lab-content-secret-key-change-in-production';
    const ADMIN_PASSWORD = localStorage.getItem('admin_password') || '';
    const ADMIN_AUTH = ADMIN_PASSWORD ? 'Basic ' + btoa('admin:' + ADMIN_PASSWORD) : '';
    const headers = { 'Content-Type': 'application/json', 'x-api-key': API_KEY };

    function toggleNav() {
      document.getElementById('topnav').classList.toggle('open');
    }
    document.addEventListener('click', (e) => {
      const nav = document.getElementById('topnav');
      if (!e.target.closest('.topbar')) nav.classList.remove('open');
    });

    function closeSearch() {
      document.getElementById('search-results').style.display = 'none';
    }

    async function apiFetch(path, opts = {}) {
      return fetch(path, { ...opts, headers: { ...headers, ...opts.headers } });
    }

    async function loadDashboard() {
      try {
        const labsRes = await apiFetch('/api/labs');
        if (!labsRes.ok) throw new Error('Auth required');
        const labs = await labsRes.json();

        const published = labs.filter(l => l.is_published).length;
        const drafts = labs.length - published;
        const subjects = [...new Set(labs.map(l => l.subject))];
        const totalVersions = labs.reduce((s, l) => s + l.current_version, 0);

        document.getElementById('stats-grid').innerHTML = `
          <div class="stat-card blue"><div class="label">Total Labs</div><div class="value">${labs.length}</div><div class="sub">${published} published, ${drafts} drafts</div></div>
          <div class="stat-card green"><div class="label">Published</div><div class="value">${published}</div><div class="sub">Available in CASUYA</div></div>
          <div class="stat-card amber"><div class="label">Drafts</div><div class="value">${drafts}</div><div class="sub">Work in progress</div></div>
          <div class="stat-card purple"><div class="label">Subjects</div><div class="value">${subjects.length}</div><div class="sub">${subjects.join(', ')}</div></div>
          <div class="stat-card cyan"><div class="label">Total Versions</div><div class="value">${totalVersions}</div><div class="sub">Across all labs</div></div>
        `;

        const subjectCounts = {};
        labs.forEach(l => { subjectCounts[l.subject] = (subjectCounts[l.subject] || 0) + 1; });
        const maxCount = Math.max(...Object.values(subjectCounts), 1);
        const colors = { chemistry: '#f87171', physics: '#60a5fa', biology: '#34d399', mathematics: '#fbbf24', default: '#c0b8a8' };

        document.getElementById('subjects-chart').innerHTML = Object.entries(subjectCounts).map(([name, count]) => `
          <div class="subject-bar">
            <div class="name"><span class="sc ${name}">${name}</span></div>
            <div class="bar-wrap"><div class="bar" style="width:${count/maxCount*100}%; background:${colors[name] || colors.default}"></div></div>
            <div class="count">${count}</div>
          </div>
        `).join('') || '<div class="empty">No labs yet</div>';

        document.getElementById('labs-list').innerHTML = labs.slice(0, 15).map(l => `
          <div class="lab-row">
            <span class="title">${l.title}</span>
            <span class="sc ${l.subject}">${l.subject}</span>
            <span class="version">v${l.current_version}</span>
            <span class="status ${l.is_published ? 'pub' : 'draft'}">${l.is_published ? 'Published' : 'Draft'}</span>
          </div>
        `).join('') || '<div class="empty">No labs yet. <a href="/editor">Create one!</a></div>';

        loadActivity();
        loadTemplates();
      } catch (err) {
        document.getElementById('stats-grid').innerHTML = `
          <div class="stat-card blue" style="grid-column:1/-1">
            <div class="label">Authentication Required</div>
            <div class="value" style="font-size:16px; margin-top:8px">Add <code>?api_key=YOUR_KEY</code> to the URL</div>
          </div>
        `;
      }
    }

    async function loadActivity() {
      try {
        const res = await fetch('/api/audit?limit=10', {
          headers: { 'Authorization': ADMIN_AUTH }
        });
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('activity-list').innerHTML = data.entries.map(e => `
          <div class="activity-item">
            <div class="activity-dot ${e.action}"></div>
            <div class="activity-text"><strong>${e.action}</strong> ${e.entity_type}${e.entity_title ? ': ' + e.entity_title : ''}</div>
            <div class="activity-time">${timeAgo(e.created_at)}</div>
          </div>
        `).join('') || '<div class="empty">No activity yet</div>';
      } catch (e) {
        document.getElementById('activity-list').innerHTML = '<div class="empty">Activity log unavailable</div>';
      }
    }

    async function loadTemplates() {
      try {
        const res = await apiFetch('/api/templates');
        if (!res.ok) return;
        const templates = await res.json();
        document.getElementById('templates-list').innerHTML = '<div class="templates-grid">' + templates.map(t => `
          <div class="template-card" onclick="window.location='/editor?template=${t.id}'">
            <div class="t-name">${t.name}</div>
            <div class="t-desc">${t.description || 'No description'}</div>
            <div class="t-meta"><span class="sc ${t.subject}">${t.subject}</span> &bull; Used ${t.use_count}x</div>
          </div>
        `).join('') + '</div>' || '<div class="empty">No templates</div>';
      } catch (e) {}
    }

    async function searchLabs() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      try {
        const res = await apiFetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        document.getElementById('search-results').style.display = 'block';
        document.getElementById('search-results-body').innerHTML = data.results.length > 0
          ? data.results.map(r => `
            <div class="lab-row">
              <span class="title">${r.title}</span>
              <span class="sc ${r.subject}">${r.subject}</span>
              <span class="version">v${r.current_version}</span>
              <span class="status ${r.is_published ? 'pub' : 'draft'}">${r.is_published ? 'Published' : 'Draft'}</span>
            </div>
          `).join('')
          : '<div class="empty">No results found</div>';
      } catch (e) {
        document.getElementById('search-results').style.display = 'block';
        document.getElementById('search-results-body').innerHTML = '<div class="empty">Search requires the full-text search migration</div>';
      }
    }

    function timeAgo(date) {
      const s = Math.floor((Date.now() - new Date(date)) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    loadDashboard();
  </script>
</body>
</html>
